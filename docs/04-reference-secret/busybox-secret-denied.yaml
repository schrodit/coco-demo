apiVersion: v1
kind: Pod
metadata:
  name: sealed-secret-denied
  namespace: default
  annotations:
    # Gzip/base64 Init-Data containing busybox-policy-exec.rego; refresh using this stage's README.
    io.katacontainers.config.hypervisor.cc_init_data: ""
    io.containerd.cri.runtime-handler: kata-qemu-coco-dev
    io.katacontainers.config.hypervisor.kernel_params: "agent.aa_kbc_params=cc_kbc::http://10.98.43.15:8080"
spec:
  runtimeClassName: kata-qemu-coco-dev
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: busybox
      image: docker.io/library/busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      imagePullPolicy: Always
      # Print only the disposable demo value; logs are allowed by this policy.
      command:
        - /bin/sh
        - -c
        - 'case "$PROTECTED_SECRET" in ""|sealed.*) echo "Secret was not unsealed" >&2; exit 1 ;; *) printf "%s\n" "$PROTECTED_SECRET" ;; esac; sleep 3600'
      env:
        - name: PROTECTED_SECRET
          valueFrom:
            secretKeyRef:
              name: sealed-secret
              key: secret
