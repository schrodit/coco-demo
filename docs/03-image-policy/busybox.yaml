apiVersion: v1
kind: Pod
metadata:
  name: image-allowed
  namespace: default
  annotations:
    # Gzip/base64 Init-Data containing busybox-policy.rego; refresh using this stage's README.
    io.katacontainers.config.hypervisor.cc_init_data: ""
    io.containerd.cri.runtime-handler: kata-qemu-coco-dev
spec:
  runtimeClassName: kata-qemu-coco-dev
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: busybox
      image: docker.io/library/busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      imagePullPolicy: Always
      command: ["/bin/sh", "-c", "echo Image allowed by guest policy"]
