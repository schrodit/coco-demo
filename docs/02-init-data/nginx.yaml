apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx
  name: nginx-no-admin
  namespace: default
  annotations:
    # Gzip/base64 Init-Data containing no-logs-exec-policy.rego.
    io.katacontainers.config.hypervisor.cc_init_data: ""
    io.containerd.cri.runtime-handler: kata-qemu-coco-dev
spec:
  containers:
  - name: nginx
    image: nginx:1.29.4
  dnsPolicy: ClusterFirst
  runtimeClassName: kata-qemu-coco-dev
