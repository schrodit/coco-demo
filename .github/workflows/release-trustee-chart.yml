name: Release Trustee Helm chart

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-trustee-chart
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository and pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.0

      - name: Build dependencies, lint, and package
        run: make trustee-build

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the chart
        shell: bash
        run: |
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          chart=modules/trustee/deployment/helm-chart
          name=$(helm show chart "$chart" | awk '/^name:/ { print $2 }')
          version=$(helm show chart "$chart" | awk '/^version:/ { print $2 }')
          helm push "dist/$name-$version.tgz" "oci://ghcr.io/$namespace/charts"

      - name: Log out of GitHub Container Registry
        if: always()
        run: helm registry logout ghcr.io
